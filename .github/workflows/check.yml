name: Check build

# Builds the site for every pull request so a broken change shows a red ✗
# before it is merged. It never deploys and has no access to deploy secrets.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.23.6"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin

      - name: Build
        run: zola build
