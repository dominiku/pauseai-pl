name: Deploy to MyDevil

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what rsync would change"
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.6"
  REMOTE_DIR: domains/pauseai.pl/public_nodejs/public/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin

      - name: Build
        run: zola build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MYDEVIL_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.MYDEVIL_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy
        env:
          TARGET: ${{ secrets.MYDEVIL_USER }}@${{ secrets.MYDEVIL_HOST }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: |
          rsync -rvz --delete --checksum $DRY_RUN public/ "$TARGET:$REMOTE_DIR"
